# Rime schema settings
# encoding: utf-8

schema:
  schema_id: yustar
  name: "宇浩・星陳"
  version: "3.11.0"
  author:
    - 作者 朱宇浩
  description: |
    星陳輸入法·繁簡平衡，適合繁簡通打派。
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 通用, 增廣 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz/
  initials: abcdefghijklmnopqrstuvwxyz/
  delimiter: "`"
  max_code_length: 4
  auto_select: false
  algebra:

translator:
  dictionary: yustar
  enable_completion: true
  enable_sentence: false
  enable_encoder: false         # 是否開啓自動造詞
  encode_commit_history: false  # 对连续上屏的词自动成词
  max_phrase_length: 4          # 自动成词的最大词长
  disable_user_dict_for_patterns:
    - "^z.*$"

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "z"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^z[a-z]*'?$"
